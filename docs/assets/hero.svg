<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">Governed Memory</title>
  <desc id="desc">Evidence memory for coding agents. Approved decisions retain both effective time and recorded history.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a39"/><stop offset="1" stop-color="#0c1625"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#bfd9e8" stroke-opacity=".035"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#658b9d"/></marker>
  </defs>
  <rect width="1120" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1120" height="320" rx="18" fill="url(#grid)"/>
  <path d="M0 318H1120" stroke="#5de2b1" stroke-opacity=".35" stroke-width="4"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="43" width="34" height="34" rx="10" fill="#5de2b1"/>
    <path d="M57 61l6 6 11-14" stroke="#102a39" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="67" fill="#b9d0dc" font-size="13" letter-spacing="2.1">EVIDENCE BEFORE RECALL</text>
    <text x="48" y="129" fill="#f4f8fb" font-size="40" font-weight="700" letter-spacing="-.8">Governed Memory</text>
    <text x="48" y="168" fill="#d4e3eb" font-size="22">Remember what was approved.</text>
    <text x="48" y="202" fill="#9fb9c8" font-size="15">Two time axes. Clear provenance. Live access checks.</text>
    <g fill="#142f3e" stroke="#33515f">
      <rect x="48" y="248" width="129" height="30" rx="15"/>
      <rect x="187" y="248" width="133" height="30" rx="15"/>
      <rect x="330" y="248" width="139" height="30" rx="15"/>
    </g>
    <g fill="#b8d0dc" font-size="11" letter-spacing=".8" text-anchor="middle">
      <text x="112" y="267">PYTHON + RUST</text><text x="253" y="267">STDIO MCP</text><text x="399" y="267">LOCAL / SELF-HOSTED</text>
    </g>
    <path d="M568 43V277" stroke="#507385" stroke-opacity=".3"/>
    <g font-family="Consolas, monospace" font-size="11" fill="#9bb3c1">
      <text x="619" y="60" letter-spacing="1.5">ONE DECISION · TWO TIME AXES</text>
      <text x="619" y="92">effective time</text><text x="619" y="244">recorded time</text>
    </g>
    <path d="M619 108H1066M619 259H1066" fill="none" stroke="#658b9d" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M714 108V134M929 108V134M929 205V259" stroke="#5de2b1" stroke-opacity=".6" stroke-dasharray="4 5"/>
    <g fill="#5de2b1"><circle cx="714" cy="108" r="4"/><circle cx="929" cy="108" r="4"/><circle cx="929" cy="259" r="4"/></g>
    <rect x="619" y="134" width="190" height="72" rx="11" fill="#132d3d" stroke="#335666"/>
    <rect x="834" y="134" width="215" height="72" rx="11" fill="#123a3c" stroke="#5de2b1" stroke-opacity=".75"/>
    <g font-family="Consolas, monospace" font-size="11">
      <text x="637" y="157" fill="#a6bdca">v1 / approved</text><text x="852" y="157" fill="#7ae9bf">v2 / approved</text>
    </g>
    <text x="637" y="186" fill="#d4e3eb" font-size="21">SQLite</text><text x="852" y="186" fill="#e5fff3" font-size="21">PostgreSQL</text>
    <text x="619" y="292" fill="#9fb9c8" font-size="13">Preserve history. Recheck authority.</text>
  </g>
</svg>
