name: governed-memory
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-memory-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ledger:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 3s
      timeout: 3s
      retries: 40
  neo4j:
    image: neo4j:5.26.12-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-graph-only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:57687:7687"
    volumes:
      - graph:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-local-graph-only}' 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 40
volumes:
  ledger:
  graph:
