name: governed-memory
services:
  memory:
    profiles: [app]
    image: governed-memory:local
    build:
      context: .
      args:
        INSTALL_MODELS: ${INSTALL_MODELS:-false}
    environment:
      MEMORY_DATABASE_URL: postgresql+psycopg://memory:${POSTGRES_PASSWORD:-local-memory-only}@postgres:5432/memory
      MEMORY_NEO4J_URI: bolt://neo4j:7687
      MEMORY_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-graph-only}
      MEMORY_TOKEN: ${MEMORY_AGENT_TOKEN:-}
    stdin_open: true
    tty: false
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-memory-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ledger:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 3s
      timeout: 3s
      retries: 40
  neo4j:
    image: neo4j:5.26.12-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-graph-only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:57687:7687"
    volumes:
      - graph:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-local-graph-only}' 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 40
  opa:
    image: openpolicyagent/opa:1.22.2-static@sha256:805656c845fb626b856fb4b4799d6c91e053a41eecc48537f4f1c2fd6974fbdd
    profiles: [policy]
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports:
      - "127.0.0.1:58181:8181"
    volumes:
      - ./src/governed_memory/policies:/policies:ro
      - ./tests/policy:/policy-tests:ro
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "--data", "/policies", "true"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ledger:
  graph:
