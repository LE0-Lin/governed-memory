[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "governed-memory"
version = "0.2.1"
description = "Approval-gated, bitemporal evidence memory for coding agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "graphiti-core==0.31.2",
  "mcp>=1.20,<2",
  "psycopg[binary]>=3.2,<4",
  "rank-bm25==0.2.2",
  "sqlalchemy>=2.0,<2.1",
  "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1", "ijson>=3.3,<4"]
models = ["sentence-transformers>=5.1,<6", "ijson>=3.3,<4"]

# The optional local models use CPU wheels. Core installs do not install PyTorch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
governed-memory = "governed_memory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires external storage or OPA", "models: requires downloaded local models"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel.force-include]
"third_party/tiktoken-LICENSE" = "governed_memory/data/tiktoken-LICENSE"
